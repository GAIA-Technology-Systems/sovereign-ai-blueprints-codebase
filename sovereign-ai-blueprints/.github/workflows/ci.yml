name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scenarios evals
      - run: pytest -q
      - name: leakage canaries
        run: python evals/run_evals.py
      - name: scenarios run offline
        run: |
          python scenarios/scenario1_docs_assistant/run.py
          python scenarios/scenario2_claims_assist/run.py
          python scenarios/scenario3_correspondence/run.py
