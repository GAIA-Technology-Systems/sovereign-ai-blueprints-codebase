[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-ai-blueprints"
version = "0.1.0"
description = "One application, three data boundaries: managed API, private endpoint, self-hosted open weights."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []          # the core runs on the standard library

[project.optional-dependencies]
azure = ["azure-identity>=1.17"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sovereign = "sovereign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
